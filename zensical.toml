# ============================================================================
# Opus Knowledge Base — Zensical Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Project metadata
# ----------------------------------------------------------------------------
[project]
site_name        = "Opus Knowledge Base"
site_description = "A knowledge repository for Opus Compliance Cloud"
site_author      = "Opus Support"
copyright        = "Copyright &copy; 2026 Opus Safety Ltd"
#site_url        = "https://www.example.com/"

# Paths relative to docs_dir
extra_css = [
  "assets/stylesheets/neural-hero.css",
  "assets/stylesheets/home-hero.css",
  "assets/stylesheets/admonitions.css",
  "assets/stylesheets/groove.css",
  "assets/stylesheets/tables.css",
  "assets/stylesheets/grid-spill.css",
  "assets/stylesheets/videos.css",
  "assets/stylesheets/labels.css",
  "assets/stylesheets/buttons.css",
  "assets/stylesheets/nav-links.css",
  "assets/stylesheets/status-banner.css",
  "assets/stylesheets/written-for.css",
]
# Sortable tables disabled — to re-enable, add these two entries back:
#   "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
#   "/assets/javascripts/tablesort.js",    # init script, still in docs/assets/javascripts
extra_javascript = [
    "/assets/javascripts/mermaid.mjs"
]

# ----------------------------------------------------------------------------
# Navigation Configuration
# ----------------------------------------------------------------------------

nav = [
  {"Home" = "index.md"},
  {"Guides" = [
    {"Getting started" = [
      {"Overview" = "pages/overview.md"},
      {"The Onboarding Process" = "pages/onboarding-process.md"}
    ]},
    {"Tasks" = [
      {"Types of task" = "pages/types-of-task.md"},
      {"Task Inboxing" = "pages/task-inboxing.md"},
      {"Task Severities" = "pages/task-severities.md"},
      {"Reporting And Logging" = [
        {"Kinds of reportable tasks" = "pages/kinds-of-reportable-tasks.md"}
      ]}
    ]},
    {"Employees" = [
      {"Adding a new employee" = "pages/adding-a-new-employee.md"},
      {"Registering an employee" = "pages/registering-an-employee.md"},
      {"Granting an employee temporary access" = "pages/granting-an-employee-temporary-access.md"},
      {"Archiving an employee" = "pages/archiving-an-employee.md"},
      {"Moving an employee" = "pages/moving-an-employee.md"},
      {"Access & Authorisations" = "pages/access-authorisations.md"}
    ]},
    {"Assets" = [
      {"Adding an asset" = "pages/adding-an-asset.md"},
      {"Archiving an asset" = "pages/archiving-an-asset.md"},
      {"Moving an asset" = "pages/moving-an-asset.md"}
    ]},
    {"Contractors" = [
      {"Contractors Overview" = "pages/contractors-overview.md"},
      {"Contractor & Project statuses" = "pages/contractor-and-project-statuses.md"},
      {"Adding a contractor" = "pages/adding-a-contractor.md"}
    ]},
    {"RAMS" = [
      {"RAMS Overview" = "pages/rams-overview.md"},
      {"Creating a RAMS project" = "pages/creating-a-rams-project.md"},
      {"Managing a RAMS project" = "pages/managing-a-rams-project.md"},
      {"Exporting a RAMS project" = "pages/exporting-a-rams-project.md"}
    ]}
  ]},
  {"System" = [
    {"System updates" = "pages/system-updates.md"},
    {"System status" = "pages/system-status.md"}
  ]}
]

draft_nav = [
  {"Guides" = [
    {"Getting started" = [
      {"Guidebooks" = [
        {"Managing Opus Compliance Cloud" = "drafts/managing-opus-compliance-cloud.md"}
      ]}
    ]},
    {"Tasks" = [
      {"Reporting And Logging" = [
        {"Reporting an incident" = "drafts/reporting-an-incident.md"},
        {"Managing an incident" = "drafts/managing-an-incident.md"}
      ]},
      {"Task Overview" = "drafts/task-overview.md"},
      {"Interacting with a task" = "drafts/interacting-with-a-task.md"},
      {"Managing a task" = "drafts/managing-a-task.md"}
    ]},
    {"Employees" = [
      {"Employees overview" = "drafts/employees-overview.md"},
      {"Access & Authorisations" = "drafts/access-authorisations.md"}
    ]},
    {"Contractors" = [
      {"Permits to Work" = "drafts/permits-to-work.md"}
    ]}
  ]}
]

# Pages built + reachable by URL but excluded from the site nav and search index.
# Managed by the more-buttons extension (Page settings -> Page visibility).
# Zensical ignores this key, like draft_nav.
unlisted_nav = [
  {"Guides" = [
    {"Getting Started" = [
      {"Guidebooks" = [
        {"Managing Opus Compliance Cloud" = "pages/managing-opus-compliance-cloud.md"}
      ]}
    ]}
  ]}
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language   = "en"
#variant   = "classic"           # default is "modern"
favicon    = "assets/config/favicon.svg"
custom_dir = "overrides"

#[project.theme.font]
#text = "Inter"
#code = "JetBrains Mono"

features = [
    # Announcement bar dismissal deliberately OFF — the incident banner
    # (overrides/main.html + mb_status_banner) must stay visible while an
    # incident is open. To make it dismissable again add "announce.dismiss".

    # Content
    "content.code.annotate",        # code block annotations
    "content.code.copy",            # copy-to-clipboard button
    "content.code.select",          # line selection button
    "content.footnote.tooltips",    # footnotes as inline tooltips
    "content.tabs.link",            # sync same-titled tabs across page
    "content.tooltips",             # enhanced link tooltips
    #"content.action.edit",         # edit page button (requires repo_url)
    #"content.action.view",         # view source button (requires repo_url)

    # Navigation
    "navigation.footer",            # prev/next links in footer
    "navigation.indexes",           # section index pages
    #"navigation.instant",          # SPA/XHR navigation — disabled: full reloads keep <head> nav tree + body in sync (reliability over speed)
    #"navigation.instant.prefetch", # prefetch on hover — requires navigation.instant
    "navigation.path",              # breadcrumb
    "navigation.tabs",              # top-level sections as header tabs
    "navigation.top",               # back-to-top button
    "navigation.tracking",          # auto-update URL with active anchor
    #"navigation.expand",           # expand all sections by default
    #"navigation.tabs.sticky",      # sticky tabs
    #"navigation.prune",            # reduce HTML size ~33%
    #"navigation.instant.progress", # progress indicator on slow connections

    # Search
    "search.highlight",             # highlight search terms on landing

    # TOC
    #"toc.follow",                  # auto-scroll TOC to active heading
    #"toc.integrate",               # render TOC in left sidebar

    # Header
    #"header.autohide",             # hide header on scroll down
]

# ----------------------------------------------------------------------------
# Icons — logo + custom admonition icons
# ----------------------------------------------------------------------------
[project.theme.icon]
logo = "opus-safety-logo"   # custom inlined SVG → overrides/.icons/opus-safety-logo.svg (fill=currentColor, adapts to theme)

[project.theme.icon.admonition]
new-addition    = "lucide/circle-plus"
improvement     = "lucide/circle-arrow-up"
feature-release = "lucide/sparkles"
status-available = "lucide/cloud-check"
status-disruption = "lucide/cloud-alert"
status-outage = "lucide/cloud-off"
status-maintenance = "lucide/wrench"
outline = "lucide/text-align-start"
step = "lucide/circle-check"
tip = "lucide/lightbulb"

# ----------------------------------------------------------------------------
# Colour palettes — light / dark
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme       = "default"
primary      = "cyan"
accent       = "light blue"
toggle.icon  = "lucide/sun"
toggle.name  = "Switch to dark mode"

[[project.theme.palette]]
scheme       = "slate"
primary      = "light blue"
accent       = "light blue"
toggle.icon  = "lucide/moon"
toggle.name  = "Switch to light mode"

# ----------------------------------------------------------------------------
# Statuses
# ----------------------------------------------------------------------------

[project.extra.status]
new = "Recently added"

# ----------------------------------------------------------------------------
# Nav labels — CUSTOM capability, not a zensical feature.
# Rendered by our forked/overridden copy of the theme's nav template at
# overrides/partials/nav-item.html. NOTE: updating zensical may require
# re-syncing that override (re-copy the packaged template and re-apply the
# marked edit — instructions in the comment at the top of that file).
# Keys must exactly match a nav title below; color is any mb-label palette
# name from docs/assets/stylesheets/labels.css.
# ----------------------------------------------------------------------------
[project.extra.nav_labels]
"Contractors" = { text = "Add-on", color = "violet" }
"RAMS" = { text = "Add-on", color = "violet" }

# ----------------------------------------------------------------------------
# Other Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.def_list]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.emoji]
emoji_index     = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

# ----------------------------------------------------------------------------
# Nav-links tags — registered by the more-buttons extension (suggestions only)
# ----------------------------------------------------------------------------
[project.extra]
# Announcement bar for open incidents ("" | "disruption" | "outage") —
# managed by the more-buttons extension, rendered by overrides/main.html.
mb_status_banner = ""
# Next maintenance window (empty when none) — managed by the more-buttons
# extension; local ISO with UTC offset, revealed client-side from 7 days
# before start by assets/javascripts/status-banner.js.
mb_maintenance_start = "2026-08-20T19:00+01:00"
mb_maintenance_end = "2026-08-20T21:00+01:00"
mb_maintenance_services = "Server, Account Login, Files, Tasks, Notifications"
# "Written for" audience registry — CUSTOM capability, not a zensical feature.
# ORDERED. overrides/partials/content.html renders a line of mb-label pills
# directly under the page h1: the page's audience is the first entry whose
# `tag` appears in the page's `tags:` frontmatter (the three reserved audience
# tags the More Buttons "Written for" radios write), and the line shows that
# entry plus every later one ("X and above"). No audience tag → no line;
# `hide: [written-for]` suppresses it. `colour` is any mb-label palette name
# from labels.css; `icon` a theme icon path. Styling: written-for.css.
mb_audiences = [
  { tag = "Using OCC",         name = "Users",          colour = "blue",   icon = "lucide/user" },
  { tag = "Managing OCC",      name = "Managers",       colour = "purple", icon = "lucide/user-shield" },
  { tag = "Administering OCC", name = "Administrators", colour = "pink",   icon = "lucide/user-cog" },
]
mb_created_tags = [
  { name = "System" },
  { name = "Managing OCC", colour = "taupe" },
  { name = "Overview" },
  { name = "RAMS" },
  { name = "Using OCC", colour = "grey" },
  { name = "Add-on", colour = "purple" },
  { name = "Administering OCC", colour = "mauve" },
]
